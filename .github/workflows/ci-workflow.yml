jobs:
  build:
    name: Build on Windows
    runs-on: windows-2022
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      # ... 其他步骤保持不变 ...

      - name: Build DotNet4 Master
        run: |
          cd "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\"
          .\MSBuild.exe $Env:GITHUB_WORKSPACE\Dalamud.Updater.sln /t:Build /p:Configuration=Release

      # 新增步骤：生成 ZIP 文件
      - name: Create Artifact Zip
        shell: pwsh
        run: |
          $sourceDir = "Dalamud.Updater\bin\Release\net48"
          $zipPath = "Updater-artifact.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive -Path $sourceDir\* -DestinationPath $zipPath

      # 更新上传 Artifact 步骤
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Updater-artifact
          path: Updater-artifact.zip  # 指向新生成的 ZIP 文件

      # 更新创建 Release 步骤
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-Soil
          release_name: Release v1.0.0 (Soil)
          draft: false
          prerelease: false
          # 确保 asset_path 正确指向 ZIP 文件
          assets: |
            Updater-artifact.zip